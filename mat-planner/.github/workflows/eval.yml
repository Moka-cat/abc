name: Evaluation CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "eval/eval_questions.json"
      - "scripts/run_eval.py"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      judge:
        description: "Run LLM-as-Judge scoring"
        required: false
        default: "false"
        type: boolean

jobs:
  unit-tests:
    name: Unit tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        run: uv run pytest -q --tb=short
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
          EMBED_ENABLED: "false"
          LLM_NER_ENABLED: "false"

      - name: Clean up test DB
        if: always()
        run: rm -f test_ci.db

  eval-offline:
    name: Offline evaluation (no server)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run on main branch pushes or manual trigger to save CI minutes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Initialise DB + ingest sample data
        run: |
          uv run python scripts/init_db.py
          uv run python scripts/ingest_sample.py
        env:
          DATABASE_URL: "sqlite:///./eval_ci.db"
          EMBED_ENABLED: "false"   # skip embeddings in CI (no embedding API)
          LLM_NER_ENABLED: "false"
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Run evaluation (offline, first 10 questions)
        run: |
          JUDGE_FLAG=""
          if [ "${{ github.event.inputs.judge }}" = "true" ]; then
            JUDGE_FLAG="--judge"
          fi
          uv run python scripts/run_eval.py \
            --offline \
            --limit 10 \
            --output eval/eval_results_ci.json \
            $JUDGE_FLAG
        env:
          DATABASE_URL: "sqlite:///./eval_ci.db"
          EMBED_ENABLED: "false"
          LLM_NER_ENABLED: "false"
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.run_number }}
          path: eval/eval_results_ci.json

      - name: Print score summary
        run: |
          python3 - <<'EOF'
          import json, sys
          p = "eval/eval_results_ci.json"
          try:
              d = json.load(open(p))
              total, ok = d["total"], d["succeeded"]
              print(f"\n{'='*50}")
              print(f"Eval CI: {ok}/{total} completed")
              avg_score = d.get("avg_judge_score")
              if avg_score is not None:
                  print(f"Avg LLM-Judge score: {avg_score:.2f}/5.0")
              lat = d.get("avg_latency_sec", "?")
              print(f"Avg latency: {lat}s")
          except Exception as e:
              print(f"Could not read results: {e}", file=sys.stderr)
          EOF

      - name: Clean up
        if: always()
        run: rm -f eval_ci.db
