version: "3.9"

# Production deployment: mat-planner app + PostgreSQL/pgvector
#
# Usage:
#   cp .env.example .env          # fill in LLM credentials
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml exec app \
#       uv run python scripts/setup_postgres.py

services:

  # ── PostgreSQL with pgvector extension ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matplanner}
      POSTGRES_DB: ${POSTGRES_DB:-matplanner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matplanner} -d ${POSTGRES_DB:-matplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── mat-planner API ──────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-matplanner}:${POSTGRES_PASSWORD:-matplanner}@postgres:5432/${POSTGRES_DB:-matplanner}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_ENABLED: ${EMBED_ENABLED:-true}
      EMBED_DIM: ${EMBED_DIM:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/data      # mount point for ingested files

volumes:
  pgdata:
  app_data:
