[project]
name = "mat-planner"
version = "0.1.0"
description = "Memory + MCP + Planning Agent for propellant and energetic material literature"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "httpx>=0.28.0",
    "mcp[cli]>=1.28.1",
    "openai>=2.44.0",
    "pymupdf>=1.27.2.3",
    "langgraph>=1.2.6",
    "numpy>=2.4.6",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "rdkit>=2026.3.3",
    "pubchempy>=1.0.5",
    "cantera>=3.2.0",
    "cea-wrap>=2.1.1",
    "pymatgen>=2026.5.4",
    "morfeus-ml>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
